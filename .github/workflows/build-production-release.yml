name: Build JARVIS production release

on:
  push:
    branches:
      - fix/background-handoff-live-news-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set production version
        run: |
          COUNT=$(git rev-list --count HEAD)
          test "$COUNT" -gt 0
          echo "JARVIS_VERSION_CODE=$((200000 + COUNT))" >> "$GITHUB_ENV"
          echo "JARVIS_VERSION_NAME=1.0.$COUNT" >> "$GITHUB_ENV"
          echo "Production package: com.jarvis.phone" >> "$GITHUB_STEP_SUMMARY"
          echo "Version: 1.0.$COUNT ($((200000 + COUNT)))" >> "$GITHUB_STEP_SUMMARY"
      - name: Build production release APK
        working-directory: mobile/android
        run: gradle --no-daemon assembleRelease
      - name: Prepare release artifact
        run: |
          cp mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk JARVIS-production-release-unsigned.apk
          APKSIGNER_JAR=$(find "$ANDROID_HOME/build-tools" -path '*/lib/apksigner.jar' -print | sort -V | tail -n 1)
          test -n "$APKSIGNER_JAR"
          cp "$APKSIGNER_JAR" apksigner.jar
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-production-release-unsigned
          path: |
            JARVIS-production-release-unsigned.apk
            apksigner.jar
          if-no-files-found: error
          retention-days: 30
