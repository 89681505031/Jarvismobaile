name: Deploy Jarvis WhatsApp Gateway

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "whatsapp-gateway/**"
      - ".github/workflows/deploy-whatsapp-gateway.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: whatsapp-gateway
    env:
      VERCEL_SCOPE: alexpimenov6-2288
      PROJECT_NAME: jarvis-whatsapp-gateway

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Vercel token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Missing GitHub Actions secret VERCEL_TOKEN in this repository."
            exit 1
          fi

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Create project if needed
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel project add "$PROJECT_NAME"             --scope "$VERCEL_SCOPE"             --token "$VERCEL_TOKEN" || true

      - name: Link project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel link             --yes             --project "$PROJECT_NAME"             --scope "$VERCEL_SCOPE"             --token "$VERCEL_TOKEN"

      - name: Deploy production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel deploy             --prod             --yes             --scope "$VERCEL_SCOPE"             --token "$VERCEL_TOKEN"
